# Glucokinase (GCK) tiled-assembly example, long human CDS (465 aa) split across
# oligo-length tiles, one pooled order, per-tile orthogonal primers + Golden Gate.
name = "GCK"
protein_sequence = ""
cds = ""                    # native human CDS used verbatim as the frozen reference
substitutions = ["A"]            # alanine scan (swap for a full DMS: all 20 residues)
platform = "twist_oligo_pools"
seed = 7

[optimization]
species = "e_coli"               # only used to pick codons for the *mutant* residue

[tiled]
oligo_budget = 300
enzyme = "BsaI"
primer_set = "subramanian2018"
vector_context_5 = "TGGA"
vector_context_3 = "GGAG"

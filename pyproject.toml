[project]
name = "library-designer"
version = "0.1.0"
description = "Design DNA variant libraries for pooled or arrayed synthesis; output feeds uSort-M."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Micah Olivas", email = "mbolivas@stanford.edu" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "dnachisel>=3.2",
    "python_codon_tables>=0.1",   # species codon-usage tables for backbone-and-stamp optimization
    "matplotlib>=3.8",            # codon-usage and tile-layout QC plots
    "biopython>=1.80",            # read starting plasmids (.gb / .dna / .fasta), write GenBank maps
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/library_designer"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# The notebooks are the package's main teaching surface, so JupyterLab comes with the
# project rather than being passed in with --with on every launch. Both groups are
# installed by default; `uv sync --no-group notebooks` skips this one.
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[tool.uv]
default-groups = ["dev", "notebooks"]
